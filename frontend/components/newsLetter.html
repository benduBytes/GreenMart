<div class="flex flex-col items-center justify-center text-center space-y-2 mt-24 px-4 md:px- pb-14">
    <h1 class="md:text-4xl text-2xl font-semibold">Never Miss a Deal!</h1>
    <p class="md:text-lg text-gray-500/70 pb-8 max-w-lg">
        Subscribe to get the latest offers, new arrivals, and exclusive discounts directly to your inbox.
    </p>
    
    <form class="flex items-center justify-between max-w-2xl w-full md:h-14 h-12">
        <input
            class="border border-gray-300 rounded-md h-full border-r-0 outline-none w-full rounded-r-none px-4 text-gray-500 focus:border-[var(--primary)] transition-colors"
            type="email"
            placeholder="Enter your email id"
            required
        />
        <button type="submit" class="md:px-12 px-8 h-full text-white bg-[var(--primary)] hover:bg-[var(--primary-dull)] transition-all cursor-pointer rounded-md rounded-l-none font-medium">
            Subscribe
        </button>
    </form>
</div>
