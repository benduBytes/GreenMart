<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Your Cart - GreenMart</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="font-[Outfit]">

  <div id="navbar-placeholder"></div>

  <main class="pt-4 pb-8 px-6 md:px-16 lg:px-24 xl:px-32">
      
    <div class="flex flex-col md:flex-row max-w-6xl w-full mx-auto gap-10 mt-6">
        
        <div class="flex-1">
            <h1 class="text-3xl font-medium mb-6 text-gray-800">
                Shopping Cart <span id="cart-total-count" class="text-sm text-[var(--primary)] font-medium">0 Items</span>
            </h1>

            <div class="grid grid-cols-[2fr_1fr_1fr] text-gray-500 text-sm font-medium pb-3 border-b border-gray-200 mb-4">
                <p class="text-left">Product Details</p>
                <p class="text-center">Quantity</p>
                <p class="text-center">Total</p>
            </div>

            <div id="cart-items-list" class="flex flex-col gap-6">
                 <p class="text-gray-500 text-center py-10">Your cart is empty.</p>
            </div>

            <a href="products.html" class="group cursor-pointer flex items-center mt-8 gap-2 text-[var(--primary)] font-medium hover:opacity-80 transition w-fit">
                <svg width="15" height="11" viewBox="0 0 15 11" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M14.09 5.5H1M6.143 10 1 5.5 6.143 1" class="stroke-[var(--primary)]" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
                Continue Shopping
            </a>
        </div>

        <div class="w-full md:w-[360px]">
            <div class="bg-gray-100/40 p-6 border border-gray-300/70 rounded-md">
                <h2 class="text-xl font-medium text-gray-800">Order Summary</h2>
                <hr class="border-gray-300 my-5" />

                <div class="mb-6 relative" id="address-section">
                    <p class="text-sm font-medium uppercase text-gray-600">Delivery Address</p>
                    
                    <div class="flex justify-between items-start mt-2">
                        <p id="current-address" class="text-gray-500 text-sm leading-relaxed">
                            No address found
                        </p>
                        <button id="toggle-address-btn" class="text-[var(--primary)] text-sm hover:underline cursor-pointer font-medium whitespace-nowrap ml-2">
                            Change
                        </button>
                    </div>

                    <div id="address-dropdown" class="hidden absolute top-12 left-0 w-full bg-white border border-gray-200 shadow-lg rounded-md z-10 max-h-60 overflow-y-auto">
                        </div>
                </div>

                <div class="mb-6">
                    <p class="text-sm font-medium uppercase text-gray-600">Payment Method</p>
                    <select class="w-full border border-gray-300 bg-white px-3 py-2 mt-2 outline-none text-sm rounded text-gray-600 focus:border-[var(--primary)]">
                        <option value="COD">Cash On Delivery</option>
                        <option value="Online">Online Payment</option>
                    </select>
                </div>

                <hr class="border-gray-300 my-4" />

                <div class="text-gray-600 text-sm space-y-2">
                    <p class="flex justify-between">
                        <span>Subtotal</span><span id="cart-subtotal">₹0.00</span>
                    </p>
                    <p class="flex justify-between">
                        <span>Shipping Fee</span><span class="text-green-600">Free</span>
                    </p>
                    <p class="flex justify-between">
                        <span>Tax (2%)</span><span>₹0.00</span>
                    </p>
                    <p class="flex justify-between text-lg font-medium mt-4 text-gray-900 border-t border-gray-200 pt-3">
                        <span>Total Amount:</span><span id="cart-total">₹0.00</span>
                    </p>
                </div>

                <button onclick="window.location.href='place-order.html'" class="w-full py-3 mt-6 cursor-pointer bg-[var(--primary)] text-white font-medium hover:opacity-90 transition rounded shadow-md">
                    Place Order
                </button>
            </div>
        </div>

    </div>

  </main>

  <div id="login-placeholder"></div>
  <div id="signup-placeholder"></div>
  <div id="footer-placeholder"></div>

  <script src="assets/assets.js"></script>
  <script src="assets/productsData.js"></script>
  <script src="assets/footerData.js"></script>
  <script type="module" src="js/main.js"></script>

</body>
</html>
