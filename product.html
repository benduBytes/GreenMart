<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Product Details - GreenMart</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="font-[Outfit]">

  <div id="navbar-placeholder"></div>

  <main class="min-h-screen pt-10 pb-12 px-6 md:px-16 lg:px-24 xl:px-32">
    
    <div id="product-content" class="opacity-0 transition-opacity duration-500">
        
        <p class="text-gray-500 text-sm mb-6">
            <a href="index.html" class="hover:text-[var(--primary)] transition">Home</a> /
            <a href="products.html" class="hover:text-[var(--primary)] transition">Products</a> /
            <span id="breadcrumb-category" class="cursor-pointer hover:text-[var(--primary)] transition">Category</span> /
            <span id="breadcrumb-name" class="text-[var(--primary)] font-medium">Product Name</span>
        </p>
    
        <div class="flex flex-col md:flex-row gap-10 mt-4">
            
            <div class="flex flex-col-reverse md:flex-row gap-3 w-full md:w-1/2">
                
                <div id="image-gallery" class="flex md:flex-col gap-3 overflow-x-auto md:overflow-visible flex-none"></div>
    
                <div class="flex-1 border border-gray-500/30 rounded-lg overflow-hidden flex items-center justify-center bg-white h-auto md:h-[420px] w-full">
                    <img id="main-image" src="" alt="Selected product" class="w-full h-full object-contain p-6">
                </div>
            </div>
    
            <div class="text-sm w-full md:w-1/2 flex flex-col">
                <h1 id="prod-name" class="text-3xl font-medium text-gray-800">Loading...</h1>
    
                <div class="flex items-center gap-0.5 mt-2">
                    <svg width="14" height="13" viewBox="0 0 18 17" class="fill-[var(--primary)]" xmlns="http://www.w3.org/2000/svg"><path d="M8.049.927c.3-.921 1.603-.921 1.902 0l1.294 3.983a1 1 0 0 0 .951.69h4.188c.969 0 1.371 1.24.588 1.81l-3.388 2.46a1 1 0 0 0-.364 1.118l1.295 3.983c.299.921-.756 1.688-1.54 1.118L9.589 13.63a1 1 0 0 0-1.176 0l-3.389 2.46c-.783.57-1.838-.197-1.539-1.118L4.78 10.99a1 1 0 0 0-.363-1.118L1.028 7.41c-.783-.57-.38-1.81.588-1.81h4.188a1 1 0 0 0 .95-.69z"/></svg>
                    <svg width="14" height="13" viewBox="0 0 18 17" class="fill-[var(--primary)]" xmlns="http://www.w3.org/2000/svg"><path d="M8.049.927c.3-.921 1.603-.921 1.902 0l1.294 3.983a1 1 0 0 0 .951.69h4.188c.969 0 1.371 1.24.588 1.81l-3.388 2.46a1 1 0 0 0-.364 1.118l1.295 3.983c.299.921-.756 1.688-1.54 1.118L9.589 13.63a1 1 0 0 0-1.176 0l-3.389 2.46c-.783.57-1.838-.197-1.539-1.118L4.78 10.99a1 1 0 0 0-.363-1.118L1.028 7.41c-.783-.57-.38-1.81.588-1.81h4.188a1 1 0 0 0 .95-.69z"/></svg>
                    <svg width="14" height="13" viewBox="0 0 18 17" class="fill-[var(--primary)]" xmlns="http://www.w3.org/2000/svg"><path d="M8.049.927c.3-.921 1.603-.921 1.902 0l1.294 3.983a1 1 0 0 0 .951.69h4.188c.969 0 1.371 1.24.588 1.81l-3.388 2.46a1 1 0 0 0-.364 1.118l1.295 3.983c.299.921-.756 1.688-1.54 1.118L9.589 13.63a1 1 0 0 0-1.176 0l-3.389 2.46c-.783.57-1.838-.197-1.539-1.118L4.78 10.99a1 1 0 0 0-.363-1.118L1.028 7.41c-.783-.57-.38-1.81.588-1.81h4.188a1 1 0 0 0 .95-.69z"/></svg>
                    <svg width="14" height="13" viewBox="0 0 18 17" class="fill-[var(--primary)]" xmlns="http://www.w3.org/2000/svg"><path d="M8.049.927c.3-.921 1.603-.921 1.902 0l1.294 3.983a1 1 0 0 0 .951.69h4.188c.969 0 1.371 1.24.588 1.81l-3.388 2.46a1 1 0 0 0-.364 1.118l1.295 3.983c.299.921-.756 1.688-1.54 1.118L9.589 13.63a1 1 0 0 0-1.176 0l-3.389 2.46c-.783.57-1.838-.197-1.539-1.118L4.78 10.99a1 1 0 0 0-.363-1.118L1.028 7.41c-.783-.57-.38-1.81.588-1.81h4.188a1 1 0 0 0 .95-.69z"/></svg>
                    <svg width="14" height="13" viewBox="0 0 18 17" class="fill-[var(--primary)] opacity-50" xmlns="http://www.w3.org/2000/svg"><path d="M8.049.927c.3-.921 1.603-.921 1.902 0l1.294 3.983a1 1 0 0 0 .951.69h4.188c.969 0 1.371 1.24.588 1.81l-3.388 2.46a1 1 0 0 0-.364 1.118l1.295 3.983c.299.921-.756 1.688-1.54 1.118L9.589 13.63a1 1 0 0 0-1.176 0l-3.389 2.46c-.783.57-1.838-.197-1.539-1.118L4.78 10.99a1 1 0 0 0-.363-1.118L1.028 7.41c-.783-.57-.38-1.81.588-1.81h4.188a1 1 0 0 0 .95-.69z"/></svg>
                    <p class="text-base ml-2 text-gray-500">(122 reviews)</p>
                </div>
    
                <div class="mt-6">
                    <p id="prod-old-price" class="text-gray-500/70 line-through text-lg">MRP: $100</p>
                    <p id="prod-price" class="text-3xl font-medium text-gray-900">MRP: $80</p>
                    <span class="text-gray-500/70 block mt-1">(inclusive of all taxes)</span>
                </div>
    
                <p class="text-base font-medium mt-8 text-gray-800">About Product</p>
                <ul id="prod-desc-list" class="list-disc ml-5 mt-2 text-gray-500/70 space-y-1"></ul>
    
                <div class="flex items-center mt-10 gap-4 text-base">
                    <button id="add-to-cart-btn" class="w-full py-3.5 font-medium bg-gray-100 text-gray-800 hover:bg-gray-200 transition cursor-pointer rounded">
                        Add to Cart
                    </button>
                    <button id="buy-now-btn" class="w-full py-3.5 font-medium bg-[var(--primary)] text-white hover:opacity-90 transition cursor-pointer rounded shadow-md">
                        Buy now
                    </button>
                </div>
            </div>
        </div>

        <div class="mt-24">
            <div class="flex flex-col items-center mb-10">
               <p class="text-3xl font-medium uppercase text-gray-700">Related Products</p>
               <div class="w-20 h-1 bg-[var(--primary)] rounded-full mt-2"></div>
            </div>
            <div id="related-products-grid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-6 gap-y-8"></div>
        </div>

    </div>
  </main>

  <div id="login-placeholder"></div>
  <div id="signup-placeholder"></div>
  <div id="footer-placeholder"></div>

  <script src="assets/assets.js"></script>
  <script src="assets/productsData.js"></script>
  <script src="assets/footerData.js"></script>
  <script type="module" src="js/main.js"></script>

</body>
</html>
