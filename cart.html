<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Your Cart - GreenMart</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="font-[Outfit]">

  <div id="navbar-placeholder"></div>

  <main class="min-h-screen pt-10 pb-12 px-6 md:px-16 lg:px-24 xl:px-32">
      
      <div class="mb-8">
          <h1 class="text-2xl font-semibold text-gray-800">Your Shopping Cart</h1>
          <p class="text-sm text-gray-500 mt-1">Manage your items below</p>
      </div>

      <div id="cart-container" class="flex flex-col lg:flex-row gap-10">
          
          <div class="flex-1">
              <div id="cart-items-list" class="flex flex-col gap-4">
                  <p class="text-gray-500">Your cart is currently empty.</p>
              </div>
          </div>

          <div class="w-full lg:w-[350px]">
              <div class="border border-gray-200 rounded-lg p-6 bg-gray-50/50">
                  <h2 class="text-lg font-medium text-gray-800 mb-4">Order Summary</h2>
                  
                  <div class="flex justify-between text-sm text-gray-600 mb-2">
                      <span>Subtotal</span>
                      <span id="cart-subtotal">₹0.00</span>
                  </div>
                  <div class="flex justify-between text-sm text-gray-600 mb-4">
                      <span>Shipping</span>
                      <span class="text-green-600">Free</span>
                  </div>
                  
                  <hr class="border-gray-200 my-4">

                  <div class="flex justify-between text-base font-semibold text-gray-900 mb-6">
                      <span>Total</span>
                      <span id="cart-total">₹0.00</span>
                  </div>

                  <button class="w-full bg-[var(--primary)] text-white py-3 rounded font-medium hover:opacity-90 transition shadow-md">
                      PROCEED TO CHECKOUT
                  </button>
              </div>
          </div>

      </div>

  </main>

  <div id="login-placeholder"></div>
  <div id="signup-placeholder"></div>
  <div id="footer-placeholder"></div>

  <script src="assets/assets.js"></script>
  <script src="assets/productsData.js"></script>
  <script src="assets/footerData.js"></script>
  <script type="module" src="js/main.js"></script>

</body>
</html>
