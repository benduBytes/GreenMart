<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>All Products - GreenMart</title>

  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="css/style.css">
</head>

<body class="font-[Outfit]">

  <div id="navbar-placeholder"></div>

  <main class="min-h-screen pt-10 pb-12 px-6 md:px-16 lg:px-24 xl:px-32">
      
      <div class="flex flex-col items-end w-max mb-8">
        <p id="page-title" class="text-2xl font-medium uppercase text-gray-700 leading-none">All Products</p>
        <div class="w-16 h-0.5 bg-[var(--primary)] rounded-full mt-1"></div>
      </div>

      <p id="search-result-msg" class="text-gray-500 mb-6 hidden">
          Showing results for "<span id="search-query-text" class="font-bold text-black"></span>"
      </p>

      <div id="all-products-grid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-6 gap-y-8">
          </div>

  </main>

  <div id="login-placeholder"></div>
  <div id="signup-placeholder"></div>
  <div id="newsletter-placeholder"></div>
  <div id="footer-placeholder"></div>

  <script src="assets/assets.js"></script>
  <script src="assets/categoriesData.js"></script>
  <script src="assets/productsData.js"></script>
  <script src="assets/footerData.js"></script>
  <script type="module" src="js/main.js"></script>

</body>
</html>
